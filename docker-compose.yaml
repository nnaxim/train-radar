services:
  postgres:
    image: postgres:17-bookworm
    container_name: train-radar-postgres

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate

    volumes:
      - ./migrations:/migrations

volumes:
  postgres_data:
